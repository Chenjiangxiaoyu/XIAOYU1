<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F5"/>
      <stop offset=".72" stop-color="#F1F1EF"/>
      <stop offset="1" stop-color="#E8E8E5"/>
    </linearGradient>
    <linearGradient id="ground" x1="800" y1="430" x2="800" y2="900" gradientUnits="userSpaceOnUse">
