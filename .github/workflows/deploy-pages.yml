name: Publish project portfolio and Dance web app
on:
  push:
    branches: [main]
    paths:
      - 'Dance/**'
      - 'Me (web)/**'
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Dance/package-lock.json
            Me (web)/package-lock.json
      - name: Install Dance dependencies
        run: npm ci --prefix Dance
      - name: Build Dance for GitHub Pages
        run: npm run build --workspace client -- --base=/XIAOYU1/Dance/
        working-directory: Dance
      - name: Install personal website dependencies
        run: npm ci --prefix "Me (web)"
      - name: Build personal website
        run: npm run build --prefix "Me (web)"
      - name: Assemble Pages site
        run: |
          mkdir -p /tmp/project-links
          cp -a site/. /tmp/project-links/
          rm -rf site
          mkdir -p site/project-links site/Dance
          cp -a "Me (web)/dist/." site/
          cp -a /tmp/project-links/. site/project-links/
          cp -a Dance/client/dist/. site/Dance/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
