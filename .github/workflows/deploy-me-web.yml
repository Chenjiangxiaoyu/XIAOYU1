name: Deploy Me (web) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Me (web)/**'
      - '.github/workflows/deploy-me-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Me (web)/package-lock.json'

      - name: Install dependencies
        working-directory: Me (web)
        run: npm ci

      - name: Build website
        working-directory: Me (web)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Me (web)/dist'

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
